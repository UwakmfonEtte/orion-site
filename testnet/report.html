<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Orion Testnet Report</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='13' r='11' fill='%23F2F2F2'/%3E%3Ccircle cx='16' cy='13' r='5.8' fill='%23050505'/%3E%3Cpath d='M9 21c-1 5-1 8 0 9 1-2 2-5 2-9zM16 23c-1 5-1 8 0 9 1-1 1-4 1-9zM23 21c-1 4-1 7 0 8 1-2 1-4 1-8z' fill='%235DCAA5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://rpc.testnet.chain.robinhood.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* A report card: always dark, like the image it gets shared as. */
  :root {
    --paper:#050505; --plate:#0C100E; --rule:#212A26; --rule-hi:#384540;
    --ink:#F4F6F4; --ink-2:#CBD0CC; --ink-3:#939A95; --ink-4:#5E6661;
    --green:#5DCAA5; --mint:#9FE1CB; --salmon:#F0997B; --violet:#AFA9EC; --gold:#F0E48C; --idle:#38443F;
    --holo: linear-gradient(90deg,#AFA9EC,#7F77DD,#5DCAA5,#F0E48C,#F0997B,#ED93B1,#AFA9EC);
    --sans:"Manrope",-apple-system,"Segoe UI",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--mono); -webkit-font-smoothing:antialiased; }
  .card { max-width:800px; margin:0 auto; padding:48px 40px 40px; position:relative;
    background:radial-gradient(120% 60% at 100% 55%, #0E1714 0%, transparent 60%), var(--paper); }
  .card::before { content:""; position:absolute; inset:0 0 auto 0; height:4px; background:var(--holo); }
  .cap { font-size:13px; letter-spacing:.28em; text-transform:uppercase; color:var(--ink-2); }

  header { display:flex; align-items:center; gap:22px; }
  header svg { width:36px; height:auto; }
  header .name { font-family:var(--sans); font-weight:600; font-size:25px; letter-spacing:.32em; color:#F1E4C3; }
  header .cap { font-size:14px; letter-spacing:.3em; }

  .hero { display:flex; align-items:center; gap:28px; margin:52px 0 46px; }
  .hero .big { font-family:var(--sans); font-weight:800; font-size:136px; line-height:.8; letter-spacing:-.04em; }
  .hero .of { font-family:var(--sans); font-weight:700; font-size:27px; line-height:1.15; }
  .hero .sub { font-size:16px; color:var(--ink-2); margin-top:12px; }

  .dots { display:grid; grid-template-columns:repeat(30, 1fr); gap:6px; margin:24px 0 22px; }
  .dots i { aspect-ratio:1; border-radius:50%; background:var(--idle); }
  .dots i.staked { background:var(--green); }
  .dots i.loan { background:none; box-shadow:inset 0 0 0 2.5px var(--ink); }
  .dots i.rent { background:var(--gold); }
  .dots i.burned { background:none; box-shadow:inset 0 0 0 2.5px var(--violet); }
  .dots i.redeemed { background:none; box-shadow:inset 0 0 0 2.5px var(--salmon); }
  .legend { display:flex; flex-wrap:wrap; gap:10px 26px; font-size:15px; color:var(--ink-2); }
  .legend span { display:inline-flex; align-items:center; gap:10px; }
  .legend b { color:var(--ink); font-weight:600; }
  .legend i { width:14px; height:14px; border-radius:50%; display:inline-block; }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:42px; }
  .box { border:1px solid var(--rule); border-radius:12px; background:color-mix(in srgb, var(--plate) 85%, transparent); padding:24px 24px 22px; min-width:0; }
  .box.wide { grid-column:1 / -1; }
  .box .cap { font-size:12.5px; }
  .num { display:flex; align-items:baseline; gap:10px; margin:14px 0 12px; flex-wrap:wrap; }
  .num b { font-family:var(--sans); font-weight:800; font-size:44px; line-height:1; letter-spacing:-.01em; }
  .num span { font-size:16px; color:var(--ink-3); }
  .line { font-size:14.5px; line-height:1.6; color:var(--ink-2); }
  .line.up { color:var(--mint); }
  .line.muted { color:var(--ink-3); }

  .bar { display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--idle); margin:4px 0 14px; }
  .bar i { display:block; height:100%; }
  .split { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:12px; }
  .split div { font-size:13px; color:var(--ink-3); line-height:1.5; }
  .split div b { display:block; font-size:15px; color:var(--ink); font-weight:500; }
  .split div i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; }

  .wallets { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:12px; margin-top:16px; }
  .wallets div { font-size:13px; color:var(--ink-3); line-height:1.45; }
  .wallets div b { display:block; font-family:var(--sans); font-weight:800; font-size:28px; color:var(--ink); margin-bottom:4px; }

  footer { margin-top:34px; font-size:13px; line-height:1.7; color:var(--ink-3); }
  .state { padding:120px 0; text-align:center; color:var(--ink-3); font-size:14px; }
  .state.bad { color:var(--salmon); }
  .state button { margin-top:16px; font:inherit; color:var(--ink); background:none; border:1px solid var(--rule-hi); border-radius:999px; padding:8px 18px; cursor:pointer; }

  @media (max-width:640px) {
    .card { padding:36px 16px 28px; }
    header { gap:14px; } header .name { font-size:19px; } header .cap { font-size:11px; letter-spacing:.2em; }
    .hero { gap:16px; margin:36px 0 32px; } .hero .big { font-size:84px; } .hero .of { font-size:19px; }
    .dots { grid-template-columns:repeat(15, 1fr); gap:5px; }
    .grid { grid-template-columns:1fr; gap:14px; }
    .num b { font-size:36px; }
    .split, .wallets { grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>
<main class="card">
  <header>
    <svg viewBox="0 0 200 210" aria-hidden="true">
      <defs>
        <radialGradient id="ringG" cx="36%" cy="28%" r="78%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="52%" stop-color="#F2F2F2"/><stop offset="100%" stop-color="#C2C2C2"/></radialGradient>
        <linearGradient id="dripG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FE3C2"/><stop offset="52%" stop-color="#5DCAA5"/><stop offset="100%" stop-color="#42AE87" stop-opacity="0"/></linearGradient>
      </defs>
      <g fill="url(#dripG)">
        <path d="M44 108 C40 132 38 148 42 156 C46 148 50 130 52 108 Z"/><path d="M66 120 C60 152 58 178 64 192 C70 176 74 148 76 120 Z"/>
        <path d="M100 128 C94 160 92 192 100 208 C108 192 110 160 106 128 Z"/><path d="M132 120 C128 148 130 176 136 190 C142 176 144 150 140 120 Z"/>
        <path d="M156 106 C152 128 152 144 158 154 C162 144 164 128 162 106 Z"/><path d="M86 132 C82 150 82 164 86 172 C90 164 92 150 92 132 Z"/>
      </g>
      <circle cx="100" cy="88" r="70" fill="url(#ringG)"/>
      <circle cx="100" cy="88" r="37" fill="#050505"/>
      <path d="M52 62 C60 40 78 26 96 24 C80 30 64 44 58 66 Z" fill="#fff" opacity=".95"/>
    </svg>
    <span class="name">ORION</span>
    <span class="cap">Testnet report</span>
  </header>
  <div id="out"><div class="state">Reading the chain…</div></div>
</main>

<script>
/* =====================================================================
   Orion testnet report. Everything is read in the browser, from contract
   state plus the contracts' own event logs, so the card is current
   whenever it is opened. Addresses match testnet.html.
   ===================================================================== */
(function () {
  const params = new URLSearchParams(location.search);
  const CFG = {
    rpc: params.get('rpc') || 'https://rpc.testnet.chain.robinhood.com',
    nft:      '0xc52a729DdDa409f4930a56102BF5291471D6b2ce',
    treasury: '0x06FA8a26adf55117Dc6f97b30477b4e5B054A3ea',
    staking:  '0xcF3Caa2E69CB57BfBe9aDc6D0CB519f9BC995E5D',
    lending:  '0xC300bc5E852B90fbeEe340F903f8Ca26361e2CfA',
    rental:   '0x757E5B600DAcEB1B2ce6a9cfE5f4Ffe0CD501711',
    yield:    '0x28Ef76f9f2Cfa30A30427E654D2d5A6FF4692bB6',
    splitter: '0x659a01BB2C1D1112d2f9Ee640ee125377eA768dE',
    maxSupply: 150,
    mintPrice: 10n ** 15n,             // 0.001 ETH
  };
  const SEL = {
    totalMinted:'0xa2309ff8', balanceOf:'0x70a08231', totalAssets:'0x01e1d114', backingPerToken:'0x1521843e',
    loansOutstanding:'0xc78d9c17', redeemedCount:'0x52aa3e6c', defaultedCount:'0xad32a712',
    totalStaked:'0x817b1cd2', totalDistributed:'0xefca2eed',
  };
  const TOPIC = {
    transfer:   '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef',
    minted:     '0x5a3358a3d27a5373c0df2604662088d37894d56b7cfd27f315770440f4e0d919',
    redeemed:   '0x484c40561359f3e3b8be9101897f8680aa82fbe1df9fd9038e0dbc6284032646',
    borrowed:   '0x7aa2811fec0d30393c231b0ccb325dbd9fdcc74e5378b7952ee8ee437726105f',
    repaid:     '0x1b8cd61ed43bec7c6bdad3a18ffee613f99c853d16c50678d248d879e1b43438',
    liquidated: '0x09c223cfcd8c93e245f558f5f8de755fc0930fd9bc257441155ef5d54a170e0f',
    rented:     '0xc2c22f9b3a46ab612255639fae5260867af4e23fc911dffb2211899ab7610f7b',
    staked:     '0x9e71bc8eea02a63969f509818f2dafb9254532904319f9dbda79b67bd34a5f3d',
    unstaked:   '0x0f5bb82176feb1b5e747e28471aa92156a04d9f3ab9f45f28e2d704232b93f75',
    distributed:'0xc5d35a65af09b3042394b742529d10f7fbf9a37294d6b13e4d63d06f9909a15b',
    released:   '0xd5840651550c173a8bf246eede440a59253bc61eadb2e8887168faad2fad631d',
    received:   '0x88a5966d370b9919b20f3e2c13ff65706f196a4e32cc2c12bf57088f88525874',
  };
  const ZERO = '0x0000000000000000000000000000000000000000';
  const DEAD = '0x000000000000000000000000000000000000dead';
  const $ = id => document.getElementById(id);
  const low = a => a.toLowerCase();
  const pad = h => h.replace(/^0x/, '').padStart(64, '0');
  const hexOf = n => '0x' + BigInt(n).toString(16);
  const words = h => (h && h.length > 2 ? h.slice(2).match(/.{64}/g) || [] : []);
  const big = h => BigInt(h && h !== '0x' ? h : 0);
  const word = (h, i) => BigInt('0x' + (words(h)[i] || '0'));
  const topicAddr = t => '0x' + t.slice(26).toLowerCase();

  /* ---------- formatting ---------- */
  function eth(wei, dp = 6) {
    wei = BigInt(wei);
    const neg = wei < 0n; if (neg) wei = -wei;
    const unit = 10n ** BigInt(18 - dp); wei = (wei + unit / 2n) / unit * unit;   // round, don't cut off
    const whole = wei / 10n ** 18n;
    const frac = (wei % 10n ** 18n).toString().padStart(18, '0').slice(0, dp).replace(/0+$/, '');
    return (neg ? '-' : '') + whole.toString() + (frac ? '.' + frac : '');
  }
  const n = x => Number(x).toLocaleString('en-US');
  const pct = (a, b, dp = 1) => (b > 0 ? (100 * Number(a) / Number(b)).toFixed(dp) : '0') + '%';
  const plural = (k, one, many) => k === 1 ? one : (many || one + 's');

  /* ---------- reads ---------- */
  async function post(body, ms) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms);
    try {
      const r = await fetch(CFG.rpc, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), signal: ctl.signal });
      if (!r.ok) { const e = new Error('rpc ' + r.status); e.status = r.status; throw e; }
      return await r.json();
    } finally { clearTimeout(timer); }
  }
  async function call1(method, params, ms = 15000) {
    for (let attempt = 0; ; attempt++) {
      try {
        const out = await post({ jsonrpc: '2.0', id: 1, method, params }, ms);
        if (out.error) throw Object.assign(new Error(out.error.message || 'rpc error'), { rpc: true });
        return out.result;
      } catch (e) {
        // A refused query (range too large, too many results) is an answer, not a hiccup: don't retry it.
        if (e.rpc || attempt >= 2) throw e;
        await new Promise(ok => setTimeout(ok, (e.status === 429 ? 1200 : 400) * (attempt + 1)));
      }
    }
  }
  // Plain batch answered by id; a reverted call comes back null.
  async function batch(calls) {
    for (let attempt = 0; ; attempt++) {
      try {
        const out = await post(calls.map((c, i) => ({ jsonrpc: '2.0', id: i, method: c[0], params: c[1] })), 15000);
        if (!Array.isArray(out)) throw new Error('rpc answer is not a batch');
        const res = new Array(calls.length);
        for (const o of out) res[o.id] = o.error ? null : o.result;
        if (res.some(x => x === undefined)) throw new Error('rpc batch came back short');
        return res;
      } catch (e) {
        if (attempt >= 2) throw e;
        await new Promise(ok => setTimeout(ok, (e.status === 429 ? 1200 : 400) * (attempt + 1)));
      }
    }
  }
  const view = (to, sel, arg = '') => ['eth_call', [{ to, data: sel + arg }, 'latest']];

  const ADDRS = [CFG.nft, CFG.treasury, CFG.staking, CFG.lending, CFG.rental, CFG.splitter];
  const logsIn = (from, to) => call1('eth_getLogs', [{ address: ADDRS, fromBlock: hexOf(from), toBlock: hexOf(to) }], 30000);

  // A node that refuses one big range gets it in halves, down to a floor.
  async function logsSplit(from, to, depth = 0) {
    try { return await logsIn(from, to); } catch (e) {
      if (depth > 14 || to <= from) throw e;
      const mid = Math.floor((from + to) / 2);
      return (await logsSplit(from, mid, depth + 1)).concat(await logsSplit(mid + 1, to, depth + 1));
    }
  }
  // The block the contracts were deployed in, found 16 blocks at a time. Remembered per browser.
  async function deployBlock(latest) {
    const KEY = 'orion-report-deploy-' + low(CFG.nft);
    try { const v = +localStorage.getItem(KEY); if (v > 0) return v; } catch (e) {}
    let lo = 0, hi = latest;                       // code absent at lo, present at hi
    while (hi - lo > 1) {
      const step = Math.max(1, Math.floor((hi - lo) / 16));
      const pts = [];
      for (let b = lo + step; b < hi; b += step) pts.push(b);
      const codes = await batch(pts.map(b => ['eth_getCode', [CFG.nft, hexOf(b)]]));
      let i = codes.findIndex(c => c && c !== '0x');
      if (i < 0) lo = pts[pts.length - 1] || lo; else { hi = pts[i]; lo = i ? pts[i - 1] : lo; }
      if (!pts.length) break;
    }
    try { localStorage.setItem(KEY, String(hi)); } catch (e) {}
    return hi;
  }
  async function allLogs(latest) {
    try { return await logsIn(0, latest); } catch (e) {}
    return logsSplit(await deployBlock(latest), latest);
  }

  async function load() {
    const blk = await call1('eth_getBlockByNumber', ['latest', false]);
    const latest = Number(blk.number), time = Number(blk.timestamp);
    const at = a => pad(low(a));
    const [minted, onLoan, forRent, assets, backing, loansOut, redeemedCount, defaultedCount, totalStaked, distributed] =
      await batch([
        view(CFG.nft, SEL.totalMinted),
        view(CFG.nft, SEL.balanceOf, at(CFG.lending)),
        view(CFG.nft, SEL.balanceOf, at(CFG.rental)),
        view(CFG.treasury, SEL.totalAssets),
        view(CFG.treasury, SEL.backingPerToken),
        view(CFG.treasury, SEL.loansOutstanding),
        view(CFG.treasury, SEL.redeemedCount),
        view(CFG.treasury, SEL.defaultedCount),
        view(CFG.staking, SEL.totalStaked),
        view(CFG.staking, SEL.totalDistributed),
      ]);
    const logs = (await allLogs(latest)).filter(l => !l.removed);
    logs.sort((a, b) => Number(a.blockNumber) - Number(b.blockNumber) || Number(a.logIndex) - Number(b.logIndex));

    const S = {
      latest, time,
      minted: Number(big(minted)), onLoan: Number(big(onLoan)), forRent: Number(big(forRent)),
      assets: big(assets), backing: big(backing), loansOut: big(loansOut),
      redeemed: Number(big(redeemedCount)), defaulted: Number(big(defaultedCount)),
      staked: Number(big(totalStaked)), distributed: big(distributed),
      mintIn: 0n, minters: new Set(),
      redeemPaid: 0n, redeemFees: 0n, redeemers: new Set(),
      loans: 0, lentGross: 0n, interest: 0n, repaid: 0, borrowers: new Set(), liquidatedPrincipal: 0n,
      rentals: 0, rentIn: 0n, renters: new Set(), rentActive: 0, rentDays: 0,
      stakersEver: new Set(), epochs: 0,
      royaltiesIn: 0n, royaltyToBacking: 0n, royaltyToYield: 0n,
      p2p: 0,
    };
    const ownerOf = {}, stakerOf = {}, borrowerOf = {};
    const contracts = new Set([CFG.nft, CFG.treasury, CFG.staking, CFG.lending, CFG.rental, CFG.splitter, CFG.yield].map(low));

    for (const l of logs) {
      const a = low(l.address), t = l.topics, d = l.data;
      if (a === low(CFG.nft)) {
        if (t[0] === TOPIC.transfer) {
          const from = topicAddr(t[1]), to = topicAddr(t[2]), id = String(BigInt(t[3]));
          ownerOf[id] = to;
          if (from !== ZERO && !contracts.has(from) && !contracts.has(to) && to !== ZERO && to !== DEAD) S.p2p++;
        } else if (t[0] === TOPIC.minted) {
          S.minters.add(topicAddr(t[1])); S.mintIn += word(d, 2);
        }
      } else if (a === low(CFG.treasury) && t[0] === TOPIC.redeemed) {
        S.redeemers.add(topicAddr(t[1])); S.redeemPaid += word(d, 0); S.redeemFees += word(d, 1);
      } else if (a === low(CFG.lending)) {
        const id = t[2] ? String(BigInt(t[2])) : null;
        if (t[0] === TOPIC.borrowed) {
          S.loans++; S.borrowers.add(topicAddr(t[1])); S.lentGross += word(d, 0); S.interest += word(d, 1);
          borrowerOf[id] = topicAddr(t[1]);
        } else if (t[0] === TOPIC.repaid) { S.repaid++; delete borrowerOf[id]; }
        else if (t[0] === TOPIC.liquidated) { S.liquidatedPrincipal += word(d, 0); delete borrowerOf[id]; }
      } else if (a === low(CFG.rental) && t[0] === TOPIC.rented) {
        S.rentals++; S.renters.add(topicAddr(t[1])); S.rentIn += word(d, 1); S.rentDays += Number(word(d, 0));
        if (Number(word(d, 2)) > time) S.rentActive++;
      } else if (a === low(CFG.staking)) {
        const id = t[2] ? String(BigInt(t[2])) : null;
        if (t[0] === TOPIC.staked) { S.stakersEver.add(topicAddr(t[1])); stakerOf[id] = topicAddr(t[1]); }
        else if (t[0] === TOPIC.unstaked) delete stakerOf[id];
        else if (t[0] === TOPIC.distributed) S.epochs++;
      } else if (a === low(CFG.splitter)) {
        if (t[0] === TOPIC.received) S.royaltiesIn += word(d, 0);
        else if (t[0] === TOPIC.released) { S.royaltyToBacking += word(d, 0); S.royaltyToYield += word(d, 1); }
      }
    }

    // Who holds an Orion now: the wallet it sits in, or the wallet behind it when a contract holds it.
    S.holders = new Set();
    for (const [id, o] of Object.entries(ownerOf)) {
      if (o === ZERO || o === DEAD) continue;
      const who = o === low(CFG.staking) ? stakerOf[id] : o === low(CFG.lending) ? borrowerOf[id] : contracts.has(o) ? null : o;
      if (who) S.holders.add(who);
    }
    S.stakersNow = new Set(Object.values(stakerOf));
    const usedSomething = new Set([...S.stakersEver, ...S.borrowers, ...S.renters, ...S.redeemers]);
    S.activated = [...S.minters].filter(w => usedSomething.has(w)).length;
    return S;
  }

  /* ---------- render ---------- */
  function render(S) {
    const supply = Math.max(S.minted, CFG.maxSupply);
    const gone = S.redeemed + S.defaulted;
    const inWallets = Math.max(0, S.minted - gone - S.staked - S.onLoan - S.forRent);
    const remaining = S.minted - gone;
    const dots = [].concat(
      Array(S.staked).fill('staked'), Array(S.onLoan).fill('loan'), Array(S.forRent).fill('rent'),
      Array(inWallets).fill(''), Array(S.defaulted).fill('burned'), Array(S.redeemed).fill('redeemed'),
      Array(Math.max(0, supply - S.minted)).fill('unminted'));
    const earned = S.redeemFees + S.interest + S.rentIn + S.royaltyToBacking;
    const parts = [
      ['Redemption fees', S.redeemFees, 'var(--salmon)'],
      ['Loan interest', S.interest, 'var(--violet)'],
      ['Rent', S.rentIn, 'var(--gold)'],
      ['Royalties (80%)', S.royaltyToBacking, 'var(--green)'],
    ];
    const lift = S.backing > 0n ? Number(S.backing - CFG.mintPrice) * 100 / Number(CFG.mintPrice) : 0;
    const util = S.assets > 0n ? Number(S.loansOut) * 100 / Number(S.assets) : 0;
    const openLoans = S.loans - S.repaid - S.defaulted;
    const avgTerm = S.rentals ? Math.round(S.rentDays / S.rentals) : 0;
    const royaltiesTotal = S.royaltiesIn;
    const when = new Date(S.time * 1000).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' });
    const legend = [
      ['var(--green)', '', 'Staked', S.staked],
      ['', 'var(--ink)', 'On loan', S.onLoan],
      ['var(--gold)', '', 'Rental pool', S.forRent],
      ['var(--idle)', '', 'In wallets', inWallets],
      ['', 'var(--salmon)', 'Redeemed', S.redeemed],
      ['', 'var(--violet)', 'Liquidated', S.defaulted],
    ].filter(x => x[3] > 0 || x[2] === 'Staked' || x[2] === 'In wallets');

    $('out').innerHTML = `
      <section class="hero">
        <div class="big">${S.minted}</div>
        <div><div class="of">of ${supply} Orions<br>minted</div><div class="sub">${n(S.minters.size)} wallets</div></div>
      </section>

      <div class="cap">Where the ${S.minted} Orions are now</div>
      <div class="dots">${dots.map(c => `<i class="${c}"${c === 'unminted' ? ' style="opacity:.25"' : ''}></i>`).join('')}</div>
      <div class="legend">${legend.map(([fill, ring, label, k]) =>
        `<span><i style="${fill ? 'background:' + fill : 'box-shadow:inset 0 0 0 2.5px ' + ring}"></i>${label} <b>${k}</b></span>`).join('')}</div>

      <div class="grid">
        <div class="box wide">
          <div class="cap">Earned for holders</div>
          <div class="num"><b>${eth(earned)}</b><span>ETH on top of the mint</span></div>
          <div class="bar">${earned > 0n ? parts.map(([, v, c]) => `<i style="width:${Number(v) * 100 / Number(earned)}%;background:${c}"></i>`).join('') : ''}</div>
          <div class="split">${parts.map(([label, v, c]) => `<div><i style="background:${c}"></i>${label}<b>${eth(v)} ETH</b></div>`).join('')}</div>
        </div>

        <div class="box">
          <div class="cap">Taken in at mint</div>
          <div class="num"><b>${eth(S.mintIn)}</b><span>ETH</span></div>
          <div class="line">${S.minted} × ${eth(CFG.mintPrice)} ETH</div>
          <div class="line">${n(S.minters.size)} wallets minted</div>
        </div>

        <div class="box">
          <div class="cap">In the treasury now</div>
          <div class="num"><b>${eth(S.assets, 5)}</b><span>ETH</span></div>
          <div class="line">Backs each Orion: ${eth(S.backing)}</div>
          <div class="line ${lift >= 0 ? 'up' : ''}">${lift >= 0 ? '+' : ''}${lift.toFixed(2)}% on the mint price</div>
        </div>

        <div class="box">
          <div class="cap">Rentals · ${n(S.renters.size)} ${plural(S.renters.size, 'wallet')}</div>
          <div class="num"><b>${n(S.rentals)}</b><span>${plural(S.rentals, 'rental')}</span></div>
          <div class="line">${eth(S.rentIn)} ETH earned from rent</div>
          <div class="line">${S.rentActive} rented now · ${S.forRent} in the pool</div>
          ${avgTerm ? `<div class="line muted">Average term ${avgTerm} days</div>` : ''}
        </div>

        <div class="box">
          <div class="cap">Lending · ${n(S.borrowers.size)} ${plural(S.borrowers.size, 'wallet')}</div>
          <div class="num"><b>${n(S.loans)}</b><span>${plural(S.loans, 'loan')}</span></div>
          <div class="line">${S.repaid} repaid · ${openLoans} open · ${S.defaulted} defaulted</div>
          <div class="line">${eth(S.interest)} ETH kept as interest</div>
          <div class="line muted">${util.toFixed(1)}% of treasury lent (max 50%)</div>
        </div>

        <div class="box">
          <div class="cap">Redeemed</div>
          <div class="num"><b>${n(S.redeemed)}</b><span>${plural(S.redeemed, 'Orion')}</span></div>
          <div class="line">${eth(S.redeemPaid)} ETH paid out</div>
          <div class="line">5% fee kept: ${eth(S.redeemFees)} ETH</div>
          <div class="line muted">${pct(S.redeemed, S.minted)} of supply · ${n(S.redeemers.size)} ${plural(S.redeemers.size, 'wallet')}</div>
        </div>

        <div class="box">
          <div class="cap">Staking · ${n(S.stakersNow.size)} ${plural(S.stakersNow.size, 'wallet')}</div>
          <div class="num"><b>${pct(S.staked, remaining, 0)}</b><span>of Orions staked</span></div>
          <div class="line">${S.staked} of ${remaining} still in circulation</div>
          <div class="line">${eth(S.distributed)} ETH paid to stakers${S.epochs ? ` (${S.epochs} ${plural(S.epochs, 'payout')})` : ''}</div>
          <div class="line muted">Royalties in: ${eth(royaltiesTotal)} ETH</div>
        </div>

        <div class="box wide">
          <div class="cap">Wallets</div>
          <div class="wallets">
            <div><b>${n(S.minters.size)}</b>minted</div>
            <div><b>${n(S.holders.size)}</b>hold an Orion now</div>
            <div><b>${pct(S.activated, S.minters.size, 0)}</b>of minters used staking, loans, rent or redemption</div>
            <div><b>${n(S.p2p)}</b>wallet-to-wallet ${plural(S.p2p, 'transfer')}</div>
          </div>
        </div>
      </div>

      <footer>
        Robinhood Chain testnet · read from on-chain events, block ${n(S.latest)} · ${when}<br>
        Counts are wallets, not people, and include our own testing.
      </footer>`;
  }

  async function run() {
    $('out').innerHTML = '<div class="state">Reading the chain…</div>';
    try { render(await load()); }
    catch (e) {
      console.error(e);
      $('out').innerHTML = `<div class="state bad">Couldn't read the testnet (${String(e.message || e).replace(/</g, '&lt;')}).<br><button id="again">Try again</button></div>`;
      $('again').onclick = run;
    }
  }
  run();
})();
</script>
</body>
</html>
